<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOUTAM // SYSTEM LOGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { bgDark: '#0A0E17', termGreen: '#00FF66', cyberBlue: '#00F0FF', exploitRed: '#FF003C' }, 
                    fontFamily: { mono: ['"Share Tech Mono"', '"JetBrains Mono"', 'monospace'], sans: ['"Inter"', 'sans-serif'] } 
                } 
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/nexus.css">

    <style>
        /* Custom Timeline Styling */
        .timeline-container {
            position: relative;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 11px;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 0;
        }
        .timeline-item {
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .timeline-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0A0E17;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .timeline-item.active .timeline-dot {
            border-color: #00F0FF;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        .timeline-item.active .timeline-dot::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #00F0FF;
            border-radius: 50%;
        }
        .timeline-item:hover:not(.active) .timeline-dot {
            border-color: #00FF66;
        }
        .timeline-item.active .timeline-content {
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
        }

        /* Forensic Panel Animations */
        .panel-fade-in {
            animation: forensicFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes forensicFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Raw Log Scrollbar */
        .raw-logs::-webkit-scrollbar { width: 6px; }
        .raw-logs::-webkit-scrollbar-track { background: #05070A; border-radius: 4px; }
        .raw-logs::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="bg-bgDark text-gray-200 font-sans min-h-screen overflow-x-hidden selection:bg-termGreen selection:text-black relative">
    
    <div id="loader-root"></div>
    <div class="crt-overlay fixed inset-0 z-50 pointer-events-none"></div>
    <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>
    <div id="brand-root"></div>
    <div id="navbar-root"></div>

    <main class="relative z-10 pt-28 pb-20 px-4 max-w-6xl mx-auto flex flex-col items-center justify-center min-h-screen">
        
        <!-- HEADER -->
        <div class="w-full text-center sm:text-left mb-10 flex flex-col sm:flex-row sm:items-end justify-between border-b border-gray-800 pb-4 gap-4">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyberBlue/30 bg-cyberBlue/5 text-cyberBlue font-mono text-xs tracking-widest uppercase mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyberBlue animate-ping"></span>
                    SECURITY_INTEL // FORENSIC_ANALYSIS
                </div>
                <h1 class="text-3xl sm:text-4xl font-mono font-bold tracking-tight text-white">
                    <span id="cypher-heading" class="glow-blue" data-text="INCIDENT POST-MORTEM">0x00000000000</span>
                </h1>
            </div>
            <div class="font-mono text-xs text-gray-500 bg-black/50 px-3 py-1.5 rounded border border-gray-800">
                [INCIDENT_ID: <span class="text-exploitRed font-bold">#INC-8894</span>]
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full items-start">
            
            <!-- LEFT COLUMN: The Timeline -->
            <div class="lg:col-span-5 glass-terminal rounded-xl p-6 border-t-2 border-t-cyberBlue">
                <h3 class="font-mono text-sm text-gray-400 tracking-widest uppercase mb-6 border-b border-gray-800 pb-2">Attack Vector Timeline</h3>
                
                <div class="timeline-container space-y-6" id="timeline-container">
                    <!-- JavaScript will inject timeline items here -->
                </div>
            </div>

            <!-- RIGHT COLUMN: Forensic Breakdown Panel -->
            <div class="lg:col-span-7 glass-terminal rounded-xl overflow-hidden min-h-[500px] flex flex-col border border-gray-800 shadow-[0_0_30px_rgba(0,0,0,0.6)]">
                
                <!-- Panel Header -->
                <div class="bg-black/80 px-5 py-3 border-b border-gray-800 flex items-center justify-between font-mono text-xs">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-cyberBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span class="text-gray-400 uppercase tracking-widest">Forensic_Breakdown.log</span>
                    </div>
                    <span id="panel-timestamp" class="text-cyberBlue font-bold">--:--:--</span>
                </div>

                <!-- Empty State (Shows before clicking) -->
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-500 font-mono text-sm p-6 text-center">
                    <svg class="w-12 h-12 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                    Awaiting node selection.<br>Select a timeline event to view forensic telemetry.
                </div>

                <!-- Active State Content -->
                <div id="active-state" class="hidden flex-1 flex-col p-6 overflow-y-auto">
                    
                    <!-- Event Title -->
                    <h2 id="panel-title" class="text-xl sm:text-2xl font-mono font-bold text-white mb-4 uppercase tracking-wide">
                        --
                    </h2>

                    <!-- Raw Terminal Logs -->
                    <div class="mb-6">
                        <div class="text-xs font-mono text-gray-500 mb-2 uppercase tracking-widest">>> Captured System Telemetry</div>
                        <div id="panel-logs" class="bg-[#05070A] border border-gray-800 rounded p-4 font-mono text-xs sm:text-sm text-gray-300 raw-logs overflow-x-auto whitespace-pre leading-relaxed shadow-inner">
                            <!-- Logs go here -->
                        </div>
                    </div>

                    <!-- Operator Notes -->
                    <div>
                        <div class="text-xs font-mono text-gray-500 mb-2 uppercase tracking-widest">>> Operator Analysis & Mitigation</div>
                        <div class="bg-termGreen/5 border-l-4 border-termGreen p-4 rounded-r">
                            <p id="panel-notes" class="text-sm text-gray-300 font-sans leading-relaxed">
                                --
                            </p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <div id="status-root"></div>
    <div id="terminal-root"></div>

    <script src="js/components.js"></script>
    <script src="js/brand-effect.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/sys-status.js"></script>
    <script src="js/boot-loader.js"></script>
    <script src="js/global-fx.js"></script>

    <!-- FORENSIC POST-MORTEM LOGIC -->
    <script>
        // The Story Data
        const forensicData = [
            {
                id: 1,
                time: "01:14:02 AM",
                title: "Reconnaissance & Probing",
                shortDesc: "Automated port scans detected at perimeter.",
                color: "cyberBlue",
                logs: `[01:14:02] NMAP_SCAN: TCP SYN stealth scan detected
[01:14:02] SRC_IP: 194.55.x.x (Known bulletproof ASN)
[01:14:03] FIREWALL: Dropped 402 connection attempts on restricted ports
[01:14:05] HTTP_TRAFFIC: Directory brute-forcing initiated on Web_Node_01
[01:14:07] WAF_ALERT: Suspicious User-Agent string "masscan/1.3" logged`,
                notes: "Adversary initiated automated reconnaissance using Nmap and DirBuster from a known bulletproof hosting subnet. Perimeter firewalls successfully blocked 95% of anomalous traffic, but the attacker mapped external-facing web services."
            },
            {
                id: 2,
                time: "02:14:45 AM",
                title: "Initial Access (Web Shell)",
                shortDesc: "Arbitrary file upload exploited on legacy container.",
                color: "exploitRed",
                logs: `[02:14:45] HTTP_POST: /api/v1/legacy/upload (Status: 200)
[02:14:46] FILE_SYSTEM: New file created -> /var/www/html/uploads/payload.php
[02:14:48] IDS_ALERT: Reverse shell signature detected outbound to 194.55.x.x:4444
[02:14:49] PROCESS_SPAWN: /bin/bash spawned by user 'www-data'`,
                notes: "The threat actor bypassed the WAF and exploited CVE-202X-XXXX (Arbitrary File Upload) in a legacy API endpoint. A PHP web shell was dropped, granting the attacker a low-privileged interactive reverse shell under the 'www-data' user account."
            },
            {
                id: 3,
                time: "02:19:12 AM",
                title: "Privilege Escalation Attempt",
                shortDesc: "Attacker attempts to abuse misconfigured SUID binary.",
                color: "yellow-500",
                logs: `[02:19:12] BASH_HISTORY: user 'www-data' executed 'uname -a'
[02:19:12] BASH_HISTORY: user 'www-data' executed 'sudo -l'
[02:19:15] AUDITD: Anomalous execution of SUID binary '/usr/bin/pkexec'
[02:19:15] EDR_ALERT: Behavioral threat detected. Child process attempting to spawn root shell.
[02:19:16] SYSTEM: pam_unix(su:auth): authentication failure; logname=www-data uid=33`,
                notes: "After gaining initial access, the attacker performed local enumeration and attempted to exploit the 'PwnKit' vulnerability (CVE-2021-4034) to escalate privileges to root. The internal EDR (Endpoint Detection and Response) flagged the anomalous behavior immediately."
            },
            {
                id: 4,
                time: "02:22:00 AM",
                title: "Neutralization & Containment",
                shortDesc: "Automated threat containment protocols engaged.",
                color: "termGreen",
                logs: `[02:22:00] SOAR_ACTION: Executing containment playbook "ISOLATE_WEB_NODE"
[02:22:01] KERNEL: kill -9 14092 (Terminated rogue bash process)
[02:22:02] FIREWALL: iptables -A INPUT -s 194.55.x.x -j DROP
[02:22:02] FIREWALL: iptables -A OUTPUT -d 194.55.x.x -j DROP
[02:22:05] SYSTEM_STATUS: Web_Node_01 isolated from production network.
[02:22:06] ALERT: Threat neutralized. Zero data exfiltration detected.`,
                notes: "Incident Response protocols were initiated. The SOAR platform automatically killed the rogue reverse shell, dropped all inbound/outbound connections to the attacker's IP via iptables, and isolated the compromised container for forensic imaging. The attack was stopped before any lateral movement or data exfiltration occurred."
            }
        ];

        const timelineContainer = document.getElementById('timeline-container');
        const emptyState = document.getElementById('empty-state');
        const activeState = document.getElementById('active-state');
        const panelTimestamp = document.getElementById('panel-timestamp');
        const panelTitle = document.getElementById('panel-title');
        const panelLogs = document.getElementById('panel-logs');
        const panelNotes = document.getElementById('panel-notes');

        let activeItemId = null;

        // Render the timeline
        function renderTimeline() {
            forensicData.forEach((event, index) => {
                const item = document.createElement('div');
                item.className = `timeline-item flex items-start gap-4 pl-[0px]`;
                item.id = `timeline-event-${event.id}`;
                item.onclick = () => selectEvent(event.id);

                item.innerHTML = `
                    <div class="timeline-dot mt-1"></div>
                    <div class="timeline-content flex-1 border border-transparent rounded p-3 transition-colors">
                        <div class="font-mono text-xs text-${event.color} mb-1">${event.time}</div>
                        <h4 class="font-bold text-white text-sm uppercase tracking-wide">${event.title}</h4>
                        <p class="text-gray-400 text-xs font-sans mt-1">${event.shortDesc}</p>
                    </div>
                `;
                timelineContainer.appendChild(item);
            });
        }

        // Handle event selection
        function selectEvent(id) {
            // Update UI Selection state
            if (activeItemId) {
                document.getElementById(`timeline-event-${activeItemId}`).classList.remove('active');
            }
            activeItemId = id;
            document.getElementById(`timeline-event-${id}`).classList.add('active');

            const event = forensicData.find(e => e.id === id);

            // Hide empty state, show active state
            emptyState.classList.add('hidden');
            activeState.classList.remove('hidden');

            // Remove and re-add animation class for smooth transition
            activeState.classList.remove('panel-fade-in');
            void activeState.offsetWidth; // trigger reflow
            activeState.classList.add('panel-fade-in');

            // Populate data
            panelTimestamp.innerText = event.time;
            panelTimestamp.className = `font-bold text-${event.color}`;
            
            panelTitle.innerText = event.title;
            
            // Format logs with basic color coding for realism
            const formattedLogs = event.logs
                .replace(/(SRC_IP:|HTTP_POST:|IDS_ALERT:|EDR_ALERT:)/g, '<span class="text-exploitRed font-bold">$1</span>')
                .replace(/(FIREWALL:|SYSTEM_STATUS:|ALERT:)/g, '<span class="text-termGreen font-bold">$1</span>')
                .replace(/(NMAP_SCAN:|WAF_ALERT:|BASH_HISTORY:|AUDITD:)/g, '<span class="text-yellow-500 font-bold">$1</span>');
            
            panelLogs.innerHTML = formattedLogs;
            panelNotes.innerText = event.notes;
        }

        // Initialize
        renderTimeline();
    </script>
</body>
</html>
